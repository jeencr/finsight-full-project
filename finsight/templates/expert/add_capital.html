{% extends 'expert/expertheader.html' %}
    {% block title %}
FINSIGHT - ADD CAPITAL
{% endblock title %}
{% block content %}
      <div class="table-responsive">
      <br><br><br><br><br>
          <form action="/myapp/add_capital/" method="post">
          <div style="align-items: center"><center>
                    <div class="col-sm-12 col-xl-6">
                        <div class="bg-secondary rounded h-100 p-4">
                            <h6 class="mb-4">capital requierd to deposit</h6>
                            <input class="form-control form-control-lg mb-3" type="text" placeholder="capital" name="requierd_capital"
                                aria-label=".form-control-lg example">


                                <input class="form-control" placeholder="returns per capital" name="returns"
                                    id="floatingTextarea" >
                             <input class="btn btn-outline-primary w-100 m-2" type="submit">
                                 </div>


{#                            <input class="form-control form-control-sm" type="text" placeholder=".form-control-sm"#}
{#                                aria-label=".form-control-sm example">#}
                        </div>


              </center>
                </div>
                              </form>

            </div>

    </div>
            <!-- Form End -->
      {% if messages %}
          {% for i in messages %}
             <div class="alert alert-success">{{ i }}</div>

          {% endfor %}


      {% endif %}
                            </div>
{% endblock %}
